<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="slate.css">
<style>
.slide{position:relative;width:1080px;height:1350px;padding:60px 72px 0;background:#fff;overflow:hidden;margin-bottom:30px}
.slide .top{font-size:14px}
.ftr{position:absolute;left:72px;right:72px;bottom:0;height:104px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.who b{display:block;font-size:20px;font-weight:600;letter-spacing:-.2px}
.who span{display:block;font-family:JB,monospace;font-size:12.5px;color:var(--soft);margin-top:2px}
.nx{font-size:20px;font-weight:500}
.nx i{font-style:normal;color:var(--or);margin-left:6px}
/* cover */
.cv .kick{font-family:JB,monospace;font-size:16px;letter-spacing:2px;color:var(--soft);margin-top:96px}
.cv h1{font-size:104px;font-weight:600;letter-spacing:-4px;line-height:.98;margin-top:22px}
.cv h1 em{font-style:normal;color:var(--or)}
.cv .sub{font-size:30px;line-height:1.38;color:var(--mute);margin-top:30px;max-width:860px}
.cv .grid{display:grid;grid-template-columns:1fr 1fr;margin-top:64px;border-top:2px solid var(--ink)}
.cv .grid div{padding:26px 0 26px}
.cv .grid div:nth-child(even){padding-left:30px;border-left:1px solid var(--line)}
.cv .grid div:nth-child(n+3){border-top:1px solid var(--line)}
.cv .grid b{display:block;font-family:JB,monospace;font-size:58px;font-weight:500;letter-spacing:-2px;line-height:1}
.cv .grid span{display:block;font-size:21px;color:var(--mute);margin-top:10px}
.cv .inside{display:flex;gap:12px;align-items:center;margin-top:44px}
.cv .inside em{font-style:normal;font-family:JB,monospace;font-size:14px;letter-spacing:2px;color:var(--soft);margin-right:6px}
.cv .inside span{font-size:21px;font-weight:500;border:1.5px solid var(--line);border-radius:999px;padding:9px 18px}
/* lever */
.lv .kick{display:flex;align-items:center;gap:16px;margin-top:70px;font-family:JB,monospace;font-size:16px;letter-spacing:2px;color:var(--soft)}
.lv .kick .bd{font-size:22px;height:42px;min-width:64px;border-radius:7px}
.lv h2{font-size:66px;font-weight:600;letter-spacing:-2.2px;line-height:1.04;margin-top:28px}
.lv .proof{display:flex;align-items:baseline;gap:22px;margin-top:44px;padding:30px 32px;border:2px solid var(--ink);border-radius:18px}
.lv .proof b{font-family:JB,monospace;font-size:76px;font-weight:500;letter-spacing:-3px;line-height:1;white-space:nowrap}
.lv .proof span{font-size:24px;line-height:1.35;color:var(--mute)}
.lv ul{list-style:none;margin-top:38px}
.lv li{position:relative;padding-left:32px;font-size:29px;line-height:1.38;color:var(--ink2)}
.lv li+li{margin-top:18px}
.lv li:before{content:"";position:absolute;left:2px;top:.52em;width:12px;height:12px;border-radius:3px;background:var(--ink)}
.lv .why{margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}
.lv .why em{display:block;font-style:normal;font-family:JB,monospace;font-size:14px;letter-spacing:2px;color:var(--soft)}
.lv .why p{font-size:27px;line-height:1.42;color:var(--mute);margin-top:8px}
.lv .steal{position:absolute;left:72px;right:72px;bottom:138px;background:var(--panel);border:1px solid var(--panelb);border-radius:16px;padding:24px 28px}
.lv .steal em{display:block;font-style:normal;font-family:JB,monospace;font-size:14px;letter-spacing:2px;color:var(--or);font-weight:500}
.lv .steal p{font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.25;margin-top:8px}
/* twist */
.tw h2{font-size:72px;font-weight:600;letter-spacing:-2.6px;line-height:1.02;margin-top:90px}
.tw h2 em{font-style:normal;color:var(--or)}
.tw .big{margin-top:56px;display:flex;align-items:baseline;gap:24px;border-top:2px solid var(--ink);padding-top:34px}
.tw .big b{font-family:JB,monospace;font-size:150px;font-weight:500;letter-spacing:-6px;line-height:.9;color:var(--or)}
.tw .big span{font-size:30px;line-height:1.3;color:var(--mute);max-width:420px}
.tw .shift{display:grid;grid-template-columns:1fr 70px 1fr;align-items:stretch;margin-top:56px;gap:10px}
.tw .shift div{border:1.5px solid var(--line);border-radius:16px;padding:26px 28px}
.tw .shift b{display:block;font-family:JB,monospace;font-size:72px;font-weight:500;letter-spacing:-3px;line-height:1}
.tw .shift div:last-child b{color:var(--ordk)}
.tw .shift span{display:block;font-size:22px;color:var(--mute);margin-top:10px;line-height:1.35}
.tw .shift i{align-self:center;font-style:normal;text-align:center;font-size:44px;color:var(--soft)}
.tw .win{display:flex;align-items:baseline;gap:20px;margin-top:40px;padding-top:30px;border-top:1px solid var(--line)}
.tw .win b{font-family:JB,monospace;font-size:54px;font-weight:500;letter-spacing:-2px;white-space:nowrap}
.tw .win span{font-size:24px;color:var(--mute);line-height:1.35}
.tw blockquote{margin-top:44px;font-size:52px;font-weight:600;letter-spacing:-1.6px;line-height:1.1}
.tw blockquote cite{display:block;font-style:normal;font-family:JB,monospace;font-size:16px;letter-spacing:1px;color:var(--soft);font-weight:400;margin-top:16px}
.tw .take{margin-top:40px;padding-top:28px;border-top:1px solid var(--line);font-size:28px;line-height:1.42;color:var(--mute)}
.tw .take b{color:var(--ink);font-weight:600}
.tw .q{margin-top:52px;font-size:30px;line-height:1.4;color:var(--ink2)}
/* steal / stop / start */
.ss h2{font-size:66px;font-weight:600;letter-spacing:-2.2px;line-height:1.04;margin-top:70px}
.ss .cols{display:grid;grid-template-columns:1fr;gap:18px;margin-top:44px}
.ss .col{border:1.5px solid var(--line);border-radius:16px;padding:24px 28px}
.ss .col.k{border:2px solid var(--ink)}
.ss .col.n{border:2px solid var(--or)}
.ss .col em{display:block;font-style:normal;font-family:JB,monospace;font-size:15px;letter-spacing:2px;font-weight:500;color:var(--ink)}
.ss .col.n em{color:var(--or)}
.ss .col.x em{color:var(--soft)}
.ss .col li{list-style:none;font-size:25px;line-height:1.36;color:var(--ink2);margin-top:10px;padding-left:30px;position:relative}
.ss .col li:before{position:absolute;left:0;font-family:JB,monospace;font-size:22px}
.ss .k li:before{content:"✓";color:var(--ink)}
.ss .x li{color:var(--mute)}
.ss .x li:before{content:"✕";color:var(--soft)}
.ss .n li:before{content:"→";color:var(--or)}
/* end */
.en h2{font-size:92px;font-weight:600;letter-spacing:-3.4px;line-height:1.0;margin-top:140px}
.en h2 em{font-style:normal;color:var(--or)}
.en p{font-size:32px;line-height:1.4;color:var(--mute);margin-top:36px;max-width:860px}
.en .acts{margin-top:70px;display:grid;gap:16px}
.en .acts div{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:500;border:1.5px solid var(--line);border-radius:14px;padding:20px 24px}
.en .acts i{font-style:normal;font-family:JB,monospace;font-size:18px;color:var(--or);font-weight:500}
.en .src{position:absolute;left:72px;right:72px;bottom:130px;font-family:JB,monospace;font-size:14px;line-height:1.6;color:var(--soft)}
</style></head><body><div id="deck"></div>
<script src="data.js"></script>
<script>
const LOGO=document.getElementById('logo-src')?.innerHTML||'';
const TOT=LEVERS.length+4;
const topBar=i=>`<div class="top"><!--LOGO--><span><b>AIRSLATE TEARDOWN</b> · ${String(i).padStart(2,'0')} / ${TOT}</span></div>`;
const ftr=(last)=>`<div class="ftr"><div class="who"><div class="av">SS</div><div><b>Shiyam Sunder</b><span>ceo, slate · founder, tripledart</span></div></div><div class="nx">${last?'slatehq.com':'swipe<i>→</i>'}</div></div>`;
let h='';
h+=`<section class="slide cv">${topBar(1)}<div class="kick">THE PLAYBOOK BEHIND AIRSLATE</div><h1>$200M ARR<br>from <em>SEO.</em></h1>
<p class="sub">35 million pages, 37,000 comparison pages and one ugly PDF site. And why its own CEO thinks the playbook has months left.</p>
<div class="grid">${STATS.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div><div class="inside"><em>INSIDE</em><span>9 levers</span><span>the twist</span><span>steal · stop · start</span></div>${ftr()}</section>`;
LEVERS.forEach((l,i)=>{h+=`<section class="slide lv">${topBar(i+2)}<div class="kick"><i class="bd br">${String(i+1).padStart(2,'0')}</i>${l.k}</div><h2>${l.title}</h2>
<div class="proof"><b>${l.stat}</b><span>${l.statL}</span></div><ul>${l.pts.map(p=>`<li>${p}</li>`).join('')}</ul><div class="why"><em>WHY IT WORKS</em><p>${l.why}</p></div>
<div class="steal"><em>STEAL THIS</em><p>${l.steal}</p></div>${ftr()}</section>`;});
h+=`<section class="slide tw">${topBar(LEVERS.length+2)}<h2>The twist: even they think<br>this is <em>ending.</em></h2>
<div class="shift"><div><b>${TWIST.from}</b><span>${TWIST.fromL}</span></div><i>→</i><div><b>${TWIST.to}</b><span>${TWIST.toL}</span></div></div>
<div class="win"><b>${TWIST.win}</b><span>${TWIST.winL}</span></div>
<blockquote>${TWIST.q}<cite>Vadim Yasinovsky, CEO, on AI search advice</cite></blockquote>
<p class="take"><b>Our take:</b> he’s right about the hacks. What replaces keyword pages isn’t a trick. It’s being the page AI can quote.</p>
${ftr()}</section>`;
h+=`<section class="slide ss">${topBar(LEVERS.length+3)}<h2>What to steal.<br>What to stop.</h2><div class="cols">
<div class="col k"><em>STEAL (STILL WORKS IN AI SEARCH)</em><ul>${STEAL.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="col x"><em>STOP (DYING)</em><ul>${STOP.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="col n"><em>START (WHAT REPLACES IT)</em><ul>${START.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>${ftr()}</section>`;
h+=`<section class="slide en">${topBar(TOT)}<h2>Keywords built airSlate.<br><em>Answers</em> come next.</h2>
<p>The pages that win the next 5 years are the ones AI quotes, not the ones that match a keyword string.</p>
<div class="acts"><div><i>01</i>Save this for your next planning cycle</div><div><i>02</i>Repost for a founder still betting on keywords</div><div><i>03</i>Follow for weekly AI search teardowns</div></div>
<p class="src">${SRC}</p>${ftr(true)}</section>`;
document.getElementById('deck').innerHTML=h;
</script></body></html>

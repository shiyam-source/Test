<!doctype html>

<head>
<meta charset="utf-8">
<title>Slate X Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Slate Design System tokens (colors_and_type.css). Forma DJR Text -> DM Sans, Parabolica Text -> Jost. */
:root{
  --orange-500:#F66719; --orange-300:#F89762;
  --dark-900:#16161E; --dark-700:#343446; --dark-400:#585858;
  --cream:#F6F4F1; --white:#FFFFFF; --gray-200:#E2E2E2;
  --font-display:"Forma DJR Text","DM Sans",sans-serif;
  --font-body:"Parabolica Text","Jost",sans-serif;

  --bg:var(--dark-900); --ink:var(--white); --ink-2:rgba(255,255,255,.72);
  --dot:rgba(255,255,255,.16); --card:var(--dark-700); --card-line:rgba(255,255,255,.09);
  --pill-line:rgba(255,255,255,.22); --accent:var(--orange-500);
}
/* Cream variant: the website's light sections */
body.cream{
  --bg:var(--cream); --ink:var(--dark-900); --ink-2:var(--dark-400);
  --dot:rgba(22,22,30,.10); --card:var(--white); --card-line:var(--gray-200);
  --pill-line:rgba(22,22,30,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1584px;height:396px;background:var(--bg);overflow:hidden}
body{position:relative;font-family:var(--font-body);color:var(--ink)}

.dots{position:absolute;inset:0;background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.4px);background-size:22px 22px}
.glow{position:absolute;width:760px;height:760px;right:-140px;top:-180px;border-radius:50%;
  background:radial-gradient(circle,rgba(246,103,25,.22) 0%,rgba(246,103,25,0) 62%)}
body.cream .glow{background:radial-gradient(circle,rgba(246,103,25,.16) 0%,rgba(246,103,25,0) 62%)}

/* Brand mark sits top-left, clear of the profile photo zone (bottom-left) */
.brand{position:absolute;left:112px;top:95px;height:30px;color:var(--ink)}
.brand svg{height:30px;width:auto;display:block}

.copy{position:absolute;left:420px;top:97px;width:520px}
.label{font-family:var(--font-body);font-weight:500;font-size:14px;line-height:1.4;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--font-display);font-weight:400;font-size:52px;line-height:1;letter-spacing:-.02em;margin-top:18px}
h1 span{color:var(--accent)}
.sub{font-size:18px;line-height:1.4;color:var(--ink-2);margin-top:18px;max-width:470px}

.loop{display:flex;align-items:center;gap:8px;margin-top:26px}
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 15px 0 12px;border:1px solid var(--pill-line);border-radius:100px;font-size:15px;font-weight:500;white-space:nowrap}
.pill i{font-style:normal;font-size:11px;letter-spacing:.06em;color:var(--accent)}
.arrow{width:14px;height:1px;background:var(--pill-line);position:relative}
.arrow:after{content:"";position:absolute;right:0;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--pill-line);border-right:0}

/* Customer logos */
.wall{position:absolute;right:64px;top:40px;width:540px;height:316px;background:var(--card);border:1px solid var(--card-line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.wall .label{color:var(--ink-2);font-size:12px;padding:20px 24px 0}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);margin:14px 0 0}
.cell{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--card-line)}
.cell:not(:nth-child(3n+1)){border-left:1px solid var(--card-line)}
.logo{display:block;object-fit:contain;opacity:.88}
body.cream .logo{filter:brightness(0);opacity:.86}
</style>
<style>
/* X header: 1500x500. Avatar covers roughly x<375, y>333; some devices crop ~60px top and bottom. */

h1{font-size:56px}
.wall{right:56px;top:72px;width:500px;height:356px}
.glow{top:-130px}
</style>
